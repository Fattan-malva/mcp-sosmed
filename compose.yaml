services:
  mcp-sosmed:
    build: .
    container_name: mcp-sosmed
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    # ADMIN_TOKEN wajib ada di .env (dipakai untuk /mcp dan menu Cookies)
    volumes:
      - ./data:/app/data

networks:
  default:
    name: app-network
    external: true
